<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Behavioral Public Economics — Research Map</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-left">
      <h1>Behavioral Public Economics</h1>
      <span class="subtitle">Interactive Research Map</span>
    </div>
    <div class="header-right">
      <input id="search" type="text" placeholder="Search papers, researchers, topics…" />
      <div class="filters">
        <button class="filter-btn active" data-type="all">All</button>
        <button class="filter-btn" data-type="topic">Topics</button>
        <button class="filter-btn" data-type="paper">Papers</button>
        <button class="filter-btn" data-type="researcher">Researchers</button>
      </div>
    </div>
  </header>

  <div id="main">
    <div id="graph-container">
      <svg id="graph"></svg>
      <div id="zoom-controls">
        <button id="zoom-in">+</button>
        <button id="zoom-out">−</button>
        <button id="zoom-reset">⌂</button>
      </div>
    </div>

    <div id="panel" class="hidden">
      <button id="panel-close">✕</button>
      <div id="panel-type"></div>
      <h2 id="panel-title"></h2>
      <div id="panel-meta"></div>
      <p id="panel-summary"></p>
      <div id="panel-links"></div>
    </div>
  </div>

  <div id="legend">
    <div class="legend-item"><span class="dot topic"></span> Topic</div>
    <div class="legend-item"><span class="dot subtopic"></span> Subtopic</div>
    <div class="legend-item"><span class="dot paper"></span> Paper</div>
    <div class="legend-item"><span class="dot researcher"></span> Researcher</div>
  </div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="graph.js"></script>
  <script src="search.js"></script>
</body>
</html>

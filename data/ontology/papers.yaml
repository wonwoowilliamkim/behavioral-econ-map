      Motivates simplification of health insurance menus.

  - id: handel_kolstad_minten_spinnewijn_2021
    title: "The Social Determinants of Choice Quality: Evidence from Health Insurance in the Netherlands"
    authors: [Handel, Kolstad, Minten, Spinnewijn]

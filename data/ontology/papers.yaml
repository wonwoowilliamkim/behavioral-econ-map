# Papers cited in Bernheim & Taubinsky (2018) "Behavioral Public Economics"
# NBER Working Paper 24828 — Handbook of Behavioral Economics, Vol.1
# Top journals only: AER, QJE, JPE, REStud, Econometrica, JPubE, JEEA, REStat

papers:

  # ── Section 2: Behavioral Welfare Economics ─────────────────────────────

  - id: bernheim_rangel_2009
    title: "Beyond Revealed Preference: Choice-Theoretic Foundations for Behavioral Welfare Economics"
    authors: [Bernheim, Rangel]
    year: 2009
    journal: QJE
    section: "§2 Behavioral Welfare Economics"
    topics: [welfare_analysis, bpf_framework, paternalism]
    url: https://doi.org/10.1162/qjec.2009.124.1.51
    summary: >
      Proposes the Bernheim-Rangel framework for welfare analysis without relying on
      revealed preference. Introduces the unambiguous choice relation P* as the unique
      welfare criterion satisfying three basic properties. Foundation of modern behavioral
      welfare economics.

  - id: bernheim_2016
    title: "The Good, the Bad, and the Ugly: A Unified Approach to Behavioral Welfare Economics"
    authors: [Bernheim]
    year: 2016
    journal: "Journal of Benefit-Cost Analysis"
    section: "§2 Behavioral Welfare Economics"
    topics: [welfare_analysis, paternalism, bpf_framework]
    summary: >
      Refines the Bernheim-Rangel framework. Distinguishes direct vs. indirect judgments,
      argues that behavioral economics challenges indirect but not direct judgments.
      Provides revised premises for choice-oriented welfare analysis.

  - id: chetty_2015
    title: "Behavioral Economics and Public Policy: A Pragmatic Perspective"
    authors: [Chetty]
    year: 2015
    journal: AER
    section: "§2 Behavioral Welfare Economics"
    topics: [welfare_analysis, sufficient_stats, empirical_methods]
    url: https://doi.org/10.1257/aer.p20151108
    summary: >
      Advocates for the sufficient statistics approach: use reduced-form estimates of
      behavioral wedges to evaluate policy without fully specifying cognitive models.
      Frames decision utility vs. experienced utility as alternative welfare foundations.

  - id: laibson_1997
    title: "Golden Eggs and Hyperbolic Discounting"
    authors: [Laibson]
    year: 1997
    journal: QJE
    section: "§2.2.5 Time-Inconsistency; §4 Saving"
    topics: [present_bias, hyperbolic_discounting, savings_behavior]
    url: https://doi.org/10.1162/003355397555253
    summary: >
      Popularizes the β-δ (quasi-hyperbolic discounting) model. Shows that illiquid
      assets serve as commitment devices for present-biased consumers. Foundational
      paper for the self-control literature in behavioral economics.

  - id: gul_pesendorfer_2001
    title: "Temptation and Self-Control"
    authors: [Gul, Pesendorfer]
    year: 2001
    journal: Econometrica
    section: "§2.2.2 BRP; §4 Saving"
    topics: [present_bias, welfare_analysis, savings_behavior]
    summary: >
      Axiomatizes temptation preferences where consumers experience a penalty when
      choosing anything other than the most tempting option. Accounts for choice
      reversals without time inconsistency.

  # ── Section 3.2: Corrective Taxation ────────────────────────────────────

  - id: allcott_taubinsky_2015
    title: "Evaluating Behaviorally-Motivated Policy: Experimental Evidence from the Lightbulb Market"
    authors: [Allcott, Taubinsky]
    year: 2015
    journal: AER
    section: "§3.2 Corrective Taxation"
    topics: [corrective_policy, internality_tax, bias_measurement]
    url: https://doi.org/10.1257/aer.20140261
    summary: >
      Within-subject experiment on lightbulb purchases. Debiasing intervention reveals
      consumer undervaluation of energy costs. Derives price-metric bias γ and computes
      optimal corrective subsidy using the internality framework.

  - id: gruber_koszegi_2001
    title: "Is Addiction 'Rational'? Theory and Evidence"
    authors: [Gruber, Koszegi]
    year: 2001
    journal: QJE
    section: "§3.2 Corrective Taxation"
    topics: [corrective_policy, sin_taxes, present_bias]
    url: https://doi.org/10.1162/003355301753265570
    summary: >
      Incorporates quasi-hyperbolic discounting into the rational addiction model.
      Derives optimal cigarette tax that corrects both externalities and internalities
      from self-control failures. Key application of the modified Pigouvian principle.

  - id: gruber_koszegi_2004
    title: "Tax Incidence when Individuals are Time-Inconsistent: the Case of Cigarette Excise Taxes"
    authors: [Gruber, Koszegi]
    year: 2004
    journal: JPubE
    section: "§3.3 Distributional Concerns"
    topics: [corrective_policy, sin_taxes, distributional_concerns]
    url: https://doi.org/10.1016/j.jpubeco.2003.06.001
    summary: >
      Shows that cigarette taxes can be welfare-improving even for low-income consumers
      when present bias is sufficiently severe and demand is elastic. Addresses the
      regressivity concern for sin taxes.

  - id: allcott_lockwood_taubinsky_2018
    title: "Regressive Sin Taxes, with an Application to the Optimal Soda Tax"
    authors: [Allcott, Lockwood, Taubinsky]
    year: 2018
    journal: "QJE (forthcoming)"
    section: "§3.3 Distributional Concerns"
    topics: [corrective_policy, sin_taxes, distributional_concerns, internality_tax]
    summary: >
      Estimates optimal soda tax accounting for both internalities and externalities.
      Develops framework for optimal tax when sin goods are regressively consumed.
      Finds moderate tax justified despite regressivity when corrective benefits dominate.

  - id: odonoghue_rabin_2006
    title: "Optimal Sin Taxes"
    authors: [O'Donoghue, Rabin]
    year: 2006
    journal: JPubE
    section: "§3.2 Corrective Taxation"
    topics: [corrective_policy, sin_taxes, present_bias]
    url: https://doi.org/10.1016/j.jpubeco.2006.01.006
    summary: >
      Studies taxation of unhealthy foods under present-bias. Shows optimal tax is
      positive whenever present focus causes overconsumption and consumers are
      price-sensitive. General application of the modified Pigouvian principle.

  - id: allcott_mullainathan_taubinsky_2014
    title: "Energy Policy with Externalities and Internalities"
    authors: [Allcott, Mullainathan, Taubinsky]
    year: 2014
    journal: JPubE
    section: "§3.2 Corrective Taxation"
    topics: [corrective_policy, internality_tax, energy_nudges]
    summary: >
      Studies optimal policy mix (energy tax + appliance subsidy) when consumers
      underweight future energy costs. Key result: optimal energy tax is below the
      Pigouvian level because standard consumers over-respond to it.

  - id: farhi_gabaix_2015
    title: "Optimal Taxation with Behavioral Agents"
    authors: [Farhi, Gabaix]
    year: 2015
    journal: "NBER Working Paper 21524"
    section: "§3 Commodity Taxation; §5 Income Taxation"
    topics: [corrective_policy, salience_effects, income_taxation]
    summary: >
      General framework for optimal taxation with behavioral agents. Derives formulas
      for both commodity and income taxes that generalize standard sufficient statistics
      by adding price-metric bias terms. Shows Ramsey-style formulas re-emerge with
      non-salient commodity taxes.

  - id: bernheim_rangel_2004
    title: "Addiction and Cue-triggered Decision Processes"
    authors: [Bernheim, Rangel]
    year: 2004
    journal: AER
    section: "§3.3 Distributional Concerns; §4 Saving"
    topics: [present_bias, corrective_policy, bpf_framework]
    summary: >
      Models addiction as cue-triggered hot states. Argues welfare-relevant domain
      excludes choices made in triggered states using neurobiological evidence.
      Derives the surprising result that optimal tax on addictive goods may be negative.

  # ── Section 3.4: Tax Salience ────────────────────────────────────────────

  - id: chetty_looney_kroft_2009
    title: "Salience and Taxation: Theory and Evidence"
    authors: [Chetty, Looney, Kroft]
    year: 2009
    journal: AER
    section: "§3.4 Tax Salience"
    topics: [tax_salience, salience_effects, empirical_methods]
    url: https://doi.org/10.1257/aer.99.4.1145
    summary: >
      Field experiment + natural experiment showing consumers underreact to taxes not
      included in posted prices (σ ≈ 0.06–0.35). Derives efficiency cost formula showing
      underreaction reduces deadweight loss through two channels.

  - id: finkelstein_2009
    title: "E-ZTAX: Tax Salience and Tax Rates"
    authors: [Finkelstein]
    year: 2009
    journal: QJE
    section: "§3.4 Tax Salience"
    topics: [tax_salience, salience_effects]
    url: https://doi.org/10.1162/qjec.2009.124.3.969
    summary: >
      Electronic toll collection (E-ZPass) reduces tax salience, leading governments
      to raise toll rates. Natural experiment showing that salience affects the political
      economy of taxation.

  # ── Section 3.5: Nudges ──────────────────────────────────────────────────

  - id: thaler_sunstein_2003
    title: "Libertarian Paternalism"
    authors: [Thaler, Sunstein]
    year: 2003
    journal: AER
    section: "§3.5 Nudges"
    topics: [nudges_defaults, paternalism, welfare_analysis]
    url: https://doi.org/10.1257/000282803321947001
    summary: >
      Introduces libertarian paternalism: preserving choice while steering people toward
      better outcomes through defaults and framing. Argues planners inevitably influence
      choices through defaults, so should do so in welfare-enhancing ways.

  - id: allcott_rogers_2014
    title: "The Short-Run and Long-Run Effects of Behavioral Interventions: Experimental Evidence from Energy Conservation"
    authors: [Allcott, Rogers]
    year: 2014
    journal: AER
    section: "§3.5 Nudges"
    topics: [nudges_defaults, energy_nudges, social_norms]
    url: https://doi.org/10.1257/aer.104.10.3003
    summary: >
      Evaluates Opower social comparison nudges for energy conservation. Finds effects
      persist but decay over time. Estimates welfare effects of the nudge using
      willingness-to-pay elicitation.

  # ── Section 4: Policies Targeting Saving ────────────────────────────────

  - id: madrian_shea_2001
    title: "The Power of Suggestion: Inertia in 401(k) Participation and Savings Behavior"
    authors: [Madrian, Shea]
    year: 2001
    journal: QJE
    section: "§4.5 Default Options"
    topics: [nudges_defaults, retirement_defaults, savings_behavior]
    url: https://doi.org/10.1162/003355301753265543
    summary: >
      Seminal paper documenting dramatic default effects in 401(k) enrollment. Auto-
      enrollment increases participation rates from ~49% to ~86%. First rigorous
      evidence of status quo bias in retirement savings.

  - id: carroll_etal_2009
    title: "Optimal Defaults and Active Decisions"
    authors: [Carroll, Choi, Laibson, Madrian, Metrick]
    year: 2009
    journal: QJE
    section: "§4.5 Default Options"
    topics: [nudges_defaults, retirement_defaults, welfare_analysis]
    url: https://doi.org/10.1162/qjec.2009.124.4.1639
    summary: >
      Derives optimal 401(k) default contribution rate. Under long-run welfare criterion,
      sufficiently low β justifies active choice requirements rather than passive defaults.
      Shows opt-out maximization can be welfare-improving.

  - id: bernheim_fradkin_popov_2015
    title: "The Welfare Economics of Default Options in 401(k) Plans"
    authors: [Bernheim, Fradkin, Popov]
    year: 2015
    journal: AER
    section: "§4.5 Default Options"
    topics: [nudges_defaults, retirement_defaults, welfare_analysis]
    summary: >
      Applies Bernheim-Rangel framework to 401(k) defaults. Shows EVA and EVB bounds
      on welfare effects lead to similar optimal defaults for contribution rates below 20%.
      Default is generally insensitive to the decision frame in this range.

  - id: ashraf_karlan_yin_2006
    title: "Tying Odysseus to the Mast: Evidence from a Commitment Savings Product in the Philippines"
    authors: [Ashraf, Karlan, Yin]
    year: 2006
    journal: QJE
    section: "§4.3 Commitment Features"
    topics: [present_bias, savings_behavior, commitment_devices]
    url: https://doi.org/10.1162/qjec.2006.121.2.635
    summary: >
      RCT of commitment savings account (SEED) in Philippines. Documents demand for
      commitment devices, particularly among present-biased individuals. Balance
      increased 82% relative to control group.

  - id: bernheim_ray_yeltekin_2015
    title: "Poverty and Self-Control"
    authors: [Bernheim, Ray, Yeltekin]
    year: 2015
    journal: Econometrica
    section: "§4 Saving"
    topics: [present_bias, savings_behavior, commitment_devices]
    summary: >
      Formalizes internal self-control through history-dependent equilibria. Shows
      external commitments can undermine internal self-regulation. Low initial assets
      trap people in poverty by limiting self-control strategies.

  # ── Section 4.5: Program Take-Up ────────────────────────────────────────

  - id: bhargava_manoli_2015
    title: "Psychological Frictions and the Incomplete Take-Up of Social Benefits"
    authors: [Bhargava, Manoli]
    year: 2015
    journal: AER
    section: "§5.7 Tax Filing"
    topics: [sludge_friction, program_takeup, admin_burden]
    url: https://doi.org/10.1257/aer.20121493
    summary: >
      Field experiment on EITC take-up. Simplified notices dramatically increase
      take-up. Psychological frictions—not stigma—are the main barrier. Addresses
      the incomplete take-up puzzle for redistributive programs.

  # ── Section 5: Policies Targeting Earnings ──────────────────────────────

  - id: feldman_katuscak_kawano_2016
    title: "Taxpayer Confusion: Evidence from the Child Tax Credit"
    authors: [Feldman, Katuscak, Kawano]
    year: 2016
    journal: AER
    section: "§5.3 Tax Misperceptions"
    topics: [salience_effects, income_taxation, bias_measurement]
    summary: >
      RD design showing taxpayers confuse lump-sum transfers with marginal tax changes.
      Loss of CTC associated with decline in reported wage income, even though CTC is
      lump-sum and should not affect labor supply incentives.

  - id: baicker_mullainathan_schwartzstein_2015
    title: "Behavioral Hazard in Health Insurance"
    authors: [Baicker, Mullainathan, Schwartzstein]
    year: 2015
    journal: QJE
    section: "§5.6 Social Insurance"
    topics: [corrective_policy, social_insurance, empirical_methods]
    url: https://doi.org/10.1093/qje/qjv029
    summary: >
      Derives optimal copay formula for health insurance with behavioral consumers.
      Biases can cause over-use of some medications and under-use of others.
      Extends behavioral public economics framework to health insurance design.

  - id: spinnewijn_2015
    title: "Unemployed but Optimistic: Optimal Insurance Design with Biased Beliefs"
    authors: [Spinnewijn]
    year: 2015
    journal: JEEA
    section: "§5.6 Social Insurance"
    topics: [social_insurance, bias_measurement, empirical_methods]
    summary: >
      Modifies Baily-Chetty optimal unemployment insurance formula for biased beliefs
      about reemployment prospects. Slope effect (return to search) vs. level effect
      (job-finding probability) have different policy implications.

  - id: bronnenberg_etal_2015
    title: "Do Pharmacists Buy Bayer? Informed Shoppers and the Brand Premium"
    authors: [Bronnenberg, Dube, Gentzkow, Shapiro]
    year: 2015
    journal: QJE
    section: "§3.2 Corrective Taxation"
    topics: [bias_measurement, corrective_policy, empirical_methods]
    url: https://doi.org/10.1093/qje/qjv024
    summary: >
      Pharmacists and doctors buy generic drugs more than laypeople. Uses expert
      choices as rational consumer benchmark to measure bias from imperfect information.
      Application of the rational consumer benchmark welfare method.

  - id: ambuehl_bernheim_lusardi_2017
    title: "A Method for Evaluating the Quality of Financial Decision Making"
    authors: [Ambuehl, Bernheim, Lusardi]
    year: 2017
    journal: "NBER Working Paper 20618"
    section: "§4.6 Financial Education"
    topics: [bias_measurement, savings_behavior, empirical_methods]
    summary: >
      Introduces financial competence measure based on WTA discrepancies for equivalent
      claims. Shows standard financial education increases tested knowledge but not
      decision quality—motivational rhetoric drives behavioral change, not substance.

  - id: allcott_etal_2018_ramsey
    title: "Ramsey Strikes Back: Optimal Commodity Taxes and Redistribution in the Presence of Salience Effects"
    authors: [Allcott, Lockwood, Taubinsky]
    year: 2018
    journal: "AEA Papers and Proceedings"
    section: "§5.5 Consumption vs. Income Taxes"
    topics: [salience_effects, corrective_policy, distributional_concerns]
    summary: >
      Shows Atkinson-Stiglitz theorem breaks down with non-salient commodity taxes.
      Optimal commodity taxes follow Diamond (1975) Many-person Ramsey rule. Differential
      commodity taxes become useful even when income taxation is available.

  # ── NBER Boot Camp additions ─────────────────────────────────────────────
  # Papers from the NBER Behavioral Public Economics Boot Camp reading list
  # not yet covered by the Bernheim-Taubinsky (2018) handbook section

  # ── Overview ──────────────────────────────────────────────────────────────

  - id: dellavigna_2009
    title: "Psychology and Economics: Evidence from the Field"
    authors: [DellaVigna]
    year: 2009
    journal: JEL
    section: "Overview"
    topics: [welfare_analysis, empirical_methods, rct_field]
    url: https://doi.org/10.1257/jel.47.2.315
    summary: >
      Comprehensive survey of field evidence on behavioral economics: limited attention,
      non-standard beliefs, and non-standard preferences. Organizes findings around
      deviations from the standard model and evaluates their policy implications.
      Gateway reference for the field.

  # ── Tax Misperceptions (Boot Camp starred) ────────────────────────────────

  - id: taubinsky_reesjones_2018
    title: "Attention Variation and Welfare: Theory and Evidence from a Tax Salience Experiment"
    authors: [Taubinsky, Rees-Jones]
    year: 2018
    journal: REStud
    section: "Tax Misperceptions"
    topics: [salience_effects, bias_measurement, empirical_methods]
    url: https://doi.org/10.1093/restud/rdx069
    summary: >
      ★ STARRED. Runs a tax salience experiment with heterogeneous attention. Shows that
      attention to taxes varies substantially across consumers, and that ignoring this
      heterogeneity biases welfare calculations. Derives optimal tax formula accounting
      for attention variation.

  - id: stantcheva_2021
    title: "Understanding Tax Policy: How Do People Reason?"
    authors: [Stantcheva]
    year: 2021
    journal: QJE
    section: "Perceptions of Public Policy"
    topics: [perception_policy, bias_measurement, income_taxation]
    url: https://doi.org/10.1093/qje/qjab033
    summary: >
      ★ STARRED. Uses large-scale survey experiments to study how people reason about
      tax policy. Finds respondents use "mental frameworks" that shape policy views
      independently of standard economic logic. Provides new approach to measuring
      policy perceptions at scale.

  # ── Non-Standard Policy Instruments ──────────────────────────────────────

  - id: thaler_benartzi_2004
    title: "Save More Tomorrow™: Using Behavioral Economics to Increase Employee Saving"
    authors: [Thaler, Benartzi]
    year: 2004
    journal: JPE
    section: "§4.5 Default Options"
    topics: [retirement_defaults, savings_behavior, present_bias]
    url: https://doi.org/10.1086/380085
    summary: >
      Introduces the SMarT (Save More Tomorrow) program: employees commit in advance to
      automatically increase their 401(k) contribution with each pay raise. Exploits
      present bias and inertia. Participation rates triple relative to control. Highly
      influential in policy design.

  - id: chetty_friedman_etal_2014
    title: "Active vs. Passive Decisions and Crowd-Out in Retirement Savings Accounts"
    authors: [Chetty, Friedman, Leth-Petersen, Nielsen, Olsen]
    year: 2014
    journal: QJE
    section: "§4.5 Default Options"
    topics: [retirement_defaults, savings_behavior, sufficient_stats]
    url: https://doi.org/10.1093/qje/qju013
    summary: >
      Uses Danish administrative data to show 401(k) contributions from automatic
      employer contributions do not crowd out active saving, while subsidies primarily
      shift saving across accounts. 85% of people are "passive savers." Implications
      for optimal retirement savings policy design.

  - id: dellavigna_linos_2022
    title: "RCTs to Scale: Comprehensive Evidence from Two Nudges Units"
    authors: [DellaVigna, Linos]
    year: 2022
    journal: Econometrica
    section: "Non-Standard Policy Instruments"
    topics: [nudges_defaults, rct_field, empirical_methods]
    url: https://doi.org/10.3982/ECTA18709
    summary: >
      Analyzes 126 RCTs run by two large government nudge units. Academic-published
      nudges have 8× larger effect sizes than unpublished trials — publication bias
      explains much of the "nudge optimism." Provides calibration for real-world
      effectiveness of behavioral interventions at scale.

  - id: allcott_kessler_2019
    title: "The Welfare Effects of Nudges: A Case Study of Energy Use Social Comparisons"
    authors: [Allcott, Kessler]
    year: 2019
    journal: "AEJ: Applied Economics"
    section: "Non-Standard Policy Instruments"
    topics: [energy_nudges, nudges_defaults, welfare_analysis]
    url: https://doi.org/10.1257/app.20170328
    summary: >
      Combines Opower energy nudge data with willingness-to-pay elicitation to compute
      welfare effects. Finds the nudge is welfare-improving but imprecisely targeted:
      it helps the unbiased as well as the biased, and the WTP for the nudge
      is on average positive but heterogeneous.

  - id: goldin_reck_2020
    title: "Revealed Preference Analysis with Framing Effects"
    authors: [Goldin, Reck]
    year: 2020
    journal: JPE
    section: "Non-Standard Policy Instruments"
    topics: [welfare_analysis, bpf_framework, salience_effects]
    url: https://doi.org/10.1086/706767
    summary: >
      Extends revealed preference welfare analysis to account for framing effects.
      Introduces the concept of "frame-invariant preferences" and characterizes when
      observed choices identify welfare even in the presence of framing. Bridges the
      Bernheim-Rangel framework and revealed preference.

  - id: butera_etal_2022
    title: "Measuring the Welfare Effects of Shame and Pride"
    authors: [Butera, Metcalfe, Morrison, Taubinsky]
    year: 2022
    journal: AER
    section: "Non-Standard Policy Instruments"
    topics: [welfare_analysis, nudges_defaults, bias_measurement]
    url: https://doi.org/10.1257/aer.20200751
    summary: >
      Develops a method to measure the welfare effects of social image concerns (shame
      and pride) in behavioral interventions. Uses a within-subject design to elicit WTP
      for avoiding shame from charitable giving. Shows shame and pride have substantial
      and heterogeneous welfare effects that standard analyses miss.

  - id: barahona_etal_2021
    title: "Equilibrium Effects of Food Labeling Policies"
    authors: [Barahona, Otero, Otero, Kim]
    year: 2021
    journal: Econometrica
    section: "Non-Standard Policy Instruments"
    topics: [corrective_policy, nudges_defaults, bias_measurement]
    summary: >
      Studies Chile's mandatory warning labels on unhealthy foods (the "black octagon"
      policy). Combines scanner data with a structural model to identify equilibrium
      effects including firm reformulation responses. Labels reduce unhealthy purchases
      and trigger substantial product reformulation.

  # ── Insurance ──────────────────────────────────────────────────────────────

  - id: hendren_landais_spinnewijn_2021
    title: "Choice in Insurance Markets: A Pigouvian Approach to Social Insurance Design"
    authors: [Hendren, Landais, Spinnewijn]
    year: 2021
    journal: "Annual Review of Economics"
    section: "Insurance"
    topics: [pigouvian_insurance, insurance, welfare_analysis]
    url: https://doi.org/10.1146/annurev-economics-082019-110739
    summary: >
      ★ STARRED. Develops a Pigouvian framework for social insurance that accounts for
      behavioral frictions in insurance choice. Distinguishes between private and social
      valuations of insurance. Shows corrective subsidies are welfare-improving when
      behavioral frictions cause under-insurance.

  - id: chetty_2008
    title: "Moral Hazard versus Liquidity and Optimal Unemployment Insurance"
    authors: [Chetty]
    year: 2008
    journal: JPE
    section: "Insurance"
    topics: [unemployment_insurance, social_insurance, sufficient_stats]
    url: https://doi.org/10.1086/588585
    summary: >
      Disentangles moral hazard from liquidity effects in unemployment insurance.
      Shows that most of the consumption-smoothing benefit of UI comes from
      liquidity, not moral hazard reduction. Implication: optimal UI is higher
      than traditional models suggest.

  - id: dellavigna_etal_2017
    title: "Reference-Dependent Job Search: Evidence from Hungary"
    authors: [DellaVigna, Lindner, Reizer, Schmieder]
    year: 2017
    journal: QJE
    section: "Insurance"
    topics: [unemployment_insurance, present_bias, bias_measurement]
    url: https://doi.org/10.1093/qje/qjx025
    summary: >
      Uses administrative data from Hungary to show job search effort and re-employment
      hazard follow reference-dependent patterns. A spike at UI benefit exhaustion
      is consistent with loss aversion around a reference wage. Structurally estimates
      a reference-dependent job search model.

  - id: handel_2013
    title: "Adverse Selection and Inertia in Health Insurance Markets: When Nudging Hurts"
    authors: [Handel]
    year: 2013
    journal: AER
    section: "Insurance"
    topics: [health_insurance_choice, adverse_selection_inertia, welfare_analysis]
    url: https://doi.org/10.1257/aer.103.7.2643
    summary: >
      ★ Boot camp key paper. Documents large inertia in health insurance plan choice.
      Reduced-form and structural evidence that inertia generates adverse selection:
      inertia keeps healthy individuals in generous plans. Eliminating inertia reduces
      welfare through adverse selection even as it improves choice quality.

  - id: handel_kolstad_2015
    title: "Health Insurance for 'Humans': Information Frictions, Plan Choice, and Consumer Welfare"
    authors: [Handel, Kolstad]
    year: 2015
    journal: AER
    section: "Insurance"
    topics: [health_insurance_choice, bias_measurement, welfare_analysis]
    url: https://doi.org/10.1257/aer.20131126
    summary: >
      ★ Boot camp key paper. Combines revealed preference data with a survey on plan
      knowledge to separate information frictions from risk preferences in health
      insurance choice. Shows that information frictions explain much of the apparent
      risk aversion. Information provision substantially improves welfare.

  - id: abaluck_gruber_2011
    title: "Choice Inconsistencies among the Elderly: Evidence from Plan Choice in the Medicare Part D Program"
    authors: [Abaluck, Gruber]

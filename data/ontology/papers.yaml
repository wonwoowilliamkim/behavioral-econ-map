    topics: [neighborhood_effects, program_takeup, admin_burden]
    url: https://opportunityinsights.org/wp-content/uploads/2019/08/cmto_paper.pdf
    summary: >
      ★ STARRED. RCT offering housing search assistance + financial support to
      voucher-holding families in Seattle. Creates Moves to Opportunity (CMTO) treatment

    topics: [pigouvian_insurance, health_insurance_choice, inequality_mobility]
    summary: >
      ★ STARRED. Examines how socioeconomic factors predict health insurance choice
      quality using Dutch administrative data. Lower-income, less-educated households
      make systematically worse plan choices. Social determinants of choice quality
      have strong implications for corrective insurance policy design.


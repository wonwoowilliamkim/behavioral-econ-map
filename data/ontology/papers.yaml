    topics: [payday_lending, corrective_policy, bias_measurement]
    url: https://doi.org/10.1093/restud/rdab066
    summary: >
      Develops a framework to evaluate payday lending regulation with behavioral consumers.
      Uses a within-subject experiment to measure biased beliefs about loan rollovers.

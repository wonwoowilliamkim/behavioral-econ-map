# Behavioral Public Economics — Topic Ontology
# Based on Bernheim & Taubinsky (2018) "Behavioral Public Economics"
# Handbook of Behavioral Economics, Vol.1 — NBER WP 24828
# Structure: handbook section → topic → subtopics

topics:

  # ── §2: Behavioral Welfare Economics ────────────────────────────────────
  - id: welfare_analysis
    label: Behavioral Welfare Economics
    color: "#4C9BE8"
    handbook_section: "§2"
    description: >
      How to evaluate welfare when individual choices may not reflect true preferences.
      The Bernheim-Rangel "beyond revealed preference" framework provides foundations
      for behavioral welfare economics without assuming choices are utility-maximizing.
    subtopics:
      - id: bpf_framework
        label: Beyond Revealed Preference
        key_concepts:
          - Bernheim-Rangel unambiguous choice relation P*
          - Choice process data as auxiliary information
          - EVA and EVB welfare bounds
          - Ancillary conditions on choice frames

      - id: paternalism
        label: Paternalism & Libertarian Paternalism
        key_concepts:
          - Soft vs. hard paternalism
          - Nudge legitimacy
          - Autonomy preservation
          - Default-setter welfare criterion

      - id: revealed_preference_limits
        label: Limits of Revealed Preference
        key_concepts:
          - Internalities (self-harm from own choices)
          - Mistakes vs. genuine preferences
          - Decision utility vs. experienced utility
          - Sufficient statistics approach (Chetty)

  # ── §3: Corrective Taxation & Policy ────────────────────────────────────
  - id: corrective_policy
    label: Corrective Taxation & Policy
    color: "#E85C4C"
    handbook_section: "§3"
    description: >
      Optimal design of taxes and regulations when agents have biases.
      Extends Pigouvian taxation to internalities — self-imposed harms from
      present bias, inattention, or misperceptions — in addition to externalities.
    subtopics:
      - id: internality_tax
        label: Internality Taxation
        key_concepts:
          - Optimal corrective tax = externality + internality
          - Allcott-Taubinsky framework
          - Price-metric bias γ
          - Bias heterogeneity across consumers

      - id: sin_taxes
        label: Sin Taxes
        key_concepts:
          - Tobacco / cigarette taxation
          - Sugar-sweetened beverage taxes
          - Alcohol taxes
          - Modified Pigouvian principle

      - id: distributional_concerns
        label: Distributional Concerns
        key_concepts:
          - Regressivity of sin taxes
          - Atkinson-Stiglitz theorem breakdown
          - Optimal soda tax with income heterogeneity
          - Tax incidence with present-biased consumers

      - id: salience_effects
        label: Tax Salience
        key_concepts:
          - Sales tax non-salience
          - Chetty-Looney-Kroft framework
          - Underreaction coefficient σ
          - E-ZPass natural experiment

  # ── §3.5: Nudges & Defaults ──────────────────────────────────────────────
  - id: nudges_defaults
    label: Nudges & Default Effects
    color: "#48BB78"
    handbook_section: "§3.5"
    description: >
      Behavioral interventions that alter choice architecture without restricting options.
      Libertarian paternalism: preserve choice freedom while steering people toward
      better outcomes through defaults, framing, and social norms.
    subtopics:
      - id: retirement_defaults
        label: Retirement Savings Defaults
        key_concepts:
          - Auto-enrollment in 401(k) plans
          - Default contribution rates
          - Status quo bias / inertia
          - Active choice vs. passive defaults

      - id: energy_nudges
        label: Energy & Social Comparison Nudges
        key_concepts:
          - Opower social comparison reports
          - Home energy report persistence
          - Appliance efficiency information
          - Welfare cost of nudges

      - id: social_norms
        label: Social Norm Messaging
        key_concepts:
          - Descriptive norms vs. injunctive norms
          - Conservation nudges
          - Pro-social behavior

  # ── §4: Sludge & Administrative Burden ───────────────────────────────────
  - id: sludge_friction
    label: Sludge & Administrative Burden
    color: "#ED8936"
    handbook_section: "§4–§5"
    description: >
      Frictions in accessing public programs. Complexity, stigma, and psychological
      costs reduce take-up of beneficial programs, imposing welfare costs on
      eligible non-participants.
    subtopics:
      - id: program_takeup
        label: Program Take-Up & Barriers
        key_concepts:
          - EITC incomplete take-up
          - Medicaid enrollment barriers
          - Stigma effects
          - Application complexity

      - id: admin_burden
        label: Administrative Burden
        key_concepts:
          - Compliance costs
          - Sludge (Sunstein)
          - Information and psychological costs
          - Simplification experiments

  # ── §4: Saving & Self-Control ────────────────────────────────────────────
  - id: present_bias
    label: Present Bias & Self-Control
    color: "#9F7AEA"
    handbook_section: "§4"
    description: >
      Time-inconsistent preferences and their policy implications.
      The β-δ quasi-hyperbolic discounting model captures present focus
      that distorts savings, health, and labor supply decisions.
    subtopics:
      - id: hyperbolic_discounting
        label: Hyperbolic Discounting
        key_concepts:
          - β-δ (quasi-hyperbolic) model
          - Naive vs. sophisticated agents
          - Temptation and self-control utility
          - Gul-Pesendorfer representation

      - id: savings_behavior
        label: Savings & Retirement
        key_concepts:
          - Present bias in savings
          - Poverty and self-control traps
          - Illiquid assets as commitment
          - Optimal pension policy design

      - id: commitment_devices
        label: Commitment Devices
        key_concepts:
          - SEED savings account (Philippines)
          - Demand for commitment
          - Internal vs. external commitment
          - History-dependent equilibria

  # ── §5: Earnings & Labor Policy ──────────────────────────────────────────
  - id: earnings_labor
    label: Earnings & Labor Policy
    color: "#F6AD55"
    handbook_section: "§5"
    description: >
      Behavioral dimensions of income taxation, labor supply, and social insurance.
      Covers tax misperceptions, biased beliefs about unemployment, and
      behavioral hazard in health insurance.
    subtopics:
      - id: income_taxation
        label: Income Tax Misperceptions
        key_concepts:
          - Taxpayer confusion (CTC as marginal rate)
          - EITC complexity and take-up
          - Bunching at kinks
          - Optimal income tax with behavioral agents

      - id: social_insurance
        label: Social Insurance Design
        key_concepts:
          - Behavioral hazard in health insurance
          - Optimal copay formula with biases
          - Unemployment insurance with biased beliefs
          - Modified Baily-Chetty formula

  # ── Empirical Methods ────────────────────────────────────────────────────
  - id: empirical_methods
    label: Empirical Methods
    color: "#76E4F7"
    handbook_section: "cross-cutting"
    description: >
      Methods for measuring biases and evaluating behavioral interventions
      in public economics contexts. Bridges structural and reduced-form traditions.
    subtopics:
      - id: bias_measurement
        label: Measuring Consumer Biases
        key_concepts:
          - Debiasing experiments
          - Rational consumer benchmarks (expert comparison)
          - Financial competence measurement
          - Revealed vs. stated preference gaps

      - id: sufficient_stats
        label: Sufficient Statistics Approach
        key_concepts:
          - Behavioral wedges
          - Policy elasticities without full model
          - Chetty (2015) AER framework
          - Reduced-form causal identification

      - id: rct_field
        label: RCTs & Natural Experiments
        key_concepts:
          - Field experiments with randomized nudges
          - Regression discontinuity designs
          - Natural experiments (E-ZPass, 401k plans)
          - Lab-in-the-field methods

  # ── Insurance (NBER Boot Camp §Insurance) ────────────────────────────────
  - id: insurance
    label: Behavioral Insurance & Social Insurance
    color: "#B794F4"
    handbook_section: "Insurance module"
    description: >
      How behavioral frictions — inertia, inattention, biased beliefs, adverse selection —
      shape insurance markets and social insurance programs. Covers health insurance
      choice, unemployment insurance design, and the welfare cost of behavioral frictions
      in insurance markets.
    subtopics:
      - id: health_insurance_choice
        label: Health Insurance Choice & Inertia
        key_concepts:
          - Plan switching inertia
          - Dominated option choice (Medicare Part D)
          - Information frictions in plan choice
          - Adverse selection and behavioral frictions

      - id: unemployment_insurance
        label: Unemployment Insurance & Biased Beliefs
        key_concepts:
          - Biased beliefs about reemployment (Spinnewijn)
          - Moral hazard vs. liquidity (Chetty)
          - Reference-dependent job search
          - Modified Baily-Chetty formula

      - id: pigouvian_insurance
        label: Pigouvian Approach to Insurance Design
        key_concepts:
          - Hendren-Landais-Spinnewijn framework
          - Corrective insurance subsidies
          - Choice quality determinants
          - Social determinants of insurance choice

      - id: adverse_selection_inertia
        label: Adverse Selection & Inertia
        key_concepts:
          - Inertia-driven adverse selection (Handel 2013)
          - Private information and insurance rejections (Hendren 2013)
          - Advantageous selection (Fang-Keane-Silverman)
          - Cognitive ability as selection mechanism
          - High-deductible plans and blunt cost-sharing responses

  # ── Household Finance ─────────────────────────────────────────────────────
  - id: household_finance
    label: Household Finance & Consumer Credit
    color: "#F687B3"
    handbook_section: "Household Finance module"
    description: >
      Behavioral dimensions of household financial decisions: credit card debt, payday
      lending, liquidity constraints, and intertemporal choice in consumer finance.
      Connects present-bias theory to real-world debt and savings behavior.
    subtopics:
      - id: consumer_credit
        label: Credit Cards & Debt Repayment
        key_concepts:
          - Minimum payment anchoring
          - Balance-matching heuristic
          - Credit card regulation
          - Regulating consumer financial products

      - id: payday_lending
        label: High-Interest Lending
        key_concepts:
          - Payday loan welfare effects
          - Present bias and high-cost borrowing
          - Consumer protection regulation
          - Predatory lending debate

      - id: liquidity_present_bias
        label: Liquidity, Illiquidity & Commitment
        key_concepts:
          - Optimal illiquidity (Beshears et al.)
          - Present bias and balance-sheet channels
          - Macroeconomic policy implications
          - Household balance-sheet amplification

  # ── Behavioral Industrial Organization ────────────────────────────────────
  - id: behavioral_io
    label: Behavioral Industrial Organization
    color: "#68D391"
    handbook_section: "Behavioral IO module"
    description: >
      How firm strategies exploit consumer biases: shrouded add-on prices,
      overconfidence, switching costs, and inattention in product markets.
      Covers policy interventions in markets with behavioral consumers.
    subtopics:
      - id: shrouded_prices
        label: Shrouded Prices & Add-on Pricing
        key_concepts:
          - Heidhues-Kőszegi add-on pricing
          - Deceptive price framing
          - Cell phone plan complexity
          - Market equilibrium with naive consumers

      - id: overconfidence_markets
        label: Overconfidence in Consumer Markets
        key_concepts:
          - Overconfident consumers (Grubb)
          - Switching costs with biased beliefs
          - Firm exploitation of overconfidence
          - Optimal regulation

  # ── Inequality & Mobility ─────────────────────────────────────────────────
  - id: inequality_mobility
    label: Inequality, Mobility & Opportunity
    color: "#FC8181"
    handbook_section: "Inequality module"
    description: >
      Behavioral and structural barriers to economic mobility. How neighborhood effects,
      information frictions, and administrative barriers prevent low-income households
      from accessing opportunity.
    subtopics:
      - id: neighborhood_effects
        label: Neighborhood Choice & Opportunity
        key_concepts:
          - Moving to Opportunity (MTO) experiment
          - Creating Moves to Opportunity (CMTO)
          - Behavioral barriers to neighborhood choice
          - Information interventions for low-income families

      - id: perception_policy
        label: Perceptions of Tax & Social Policy
        key_concepts:
          - Stantcheva survey experiments
          - Tax policy reasoning
          - Redistribution preferences
          - Understanding policy complexity
